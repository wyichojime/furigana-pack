# テスト（JS・C#・Python）と依存の脆弱性チェック。
# main への push・PR のほか、依存に新しい脆弱性が見つかったときに気づけるよう毎週月曜にも流す。
# 失敗すると GitHub からメールが届く。
# アクションはコミットの SHA で固定する（タグの付け替えで中身が変わらないように）。更新は Dependabot が PR にする。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 9:00（日本時間）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run compile:check
      # WpfCheck（net8.0-windows）は Linux で作れないため、テストのプロジェクトだけを流す
      - run: dotnet test csharp/FuriganaPack.Tests/FuriganaPack.Tests.csproj
      - run: npm run test:python

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - run: npm run security
